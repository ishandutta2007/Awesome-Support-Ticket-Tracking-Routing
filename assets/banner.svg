<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="10"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="cardGlow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#38bdf8" flood-opacity=".15" stdDeviation="12"/></filter><style>@keyframes routePulse{0%{stroke-dashoffset:240}}@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes floatReverse{0%{transform:translateY(0)}50%{transform:translateY(7px)}}@keyframes radarSweep{0%{opacity:.3;transform:scale(.98)}50%{opacity:.8;transform:scale(1.02)}}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:42px;fill:url(#primaryGrad);letter-spacing:-.5px}.subtitle-text{font-weight:400;font-size:17px;fill:#94a3b8;letter-spacing:.2px}.badge-text{font-size:12px;font-weight:600}.badge-text,.flow-node-text,.flow-subtext{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.flow-node-text{font-size:13px;font-weight:600;fill:#e2e8f0}.flow-subtext{font-size:10px;fill:#94a3b8}.animated-wire{stroke-dasharray:8 12;animation:routePulse 3s linear infinite}.float-card-1{animation:floatSlow 6s ease-in-out infinite}.float-card-2{animation:floatReverse 7s ease-in-out infinite}.pulsing-glow{animation:radarSweep 4s ease-in-out infinite;transform-origin:center}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g stroke="#fff" stroke-width="1" opacity=".07"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="150" x2="150" y1="0" y2="360"/><line x1="300" x2="300" y1="0" y2="360"/><line x1="450" x2="450" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="750" x2="750" y1="0" y2="360"/><line x1="900" x2="900" y1="0" y2="360"/><line x1="1050" x2="1050" y1="0" y2="360"/></g><circle cx="200" cy="80" r="140" fill="#38bdf8" class="pulsing-glow" filter="url(#glow)" opacity=".12"/><circle cx="1020" cy="260" r="180" fill="#818cf8" class="pulsing-glow" filter="url(#glow)" opacity=".15"/><g filter="url(#cardGlow)" transform="translate(680, 45)"><path fill="none" stroke="#38bdf8" stroke-width="2.5" d="M 50 85 C 110 85, 110 50, 170 50" class="animated-wire" opacity=".8"/><path fill="none" stroke="#818cf8" stroke-width="2.5" d="M 50 85 C 110 85, 110 130, 170 130" class="animated-wire" opacity=".8"/><path fill="none" stroke="#c084fc" stroke-width="2.5" d="M 50 85 C 110 85, 110 205, 170 205" class="animated-wire" opacity=".8"/><path fill="none" stroke="#34d399" stroke-width="2.5" d="M 310 50 C 350 50, 350 85, 385 85" class="animated-wire" opacity=".8"/><path fill="none" stroke="#38bdf8" stroke-width="2.5" d="M 310 130 C 350 130, 350 95, 385 95" class="animated-wire" opacity=".8"/><g class="float-card-1"><rect width="105" height="60" x="-30" y="55" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="10"/><text x="22" y="78" class="flow-node-text" text-anchor="middle">📩 Inbound</text><text x="22" y="98" class="f