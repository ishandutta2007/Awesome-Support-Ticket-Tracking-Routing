<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Drop Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.15" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: url(#primaryGrad);
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 17px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
      }
      .flow-node-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      .flow-subtext {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 10px;
        fill: #94a3b8;
      }

      /* Animated routing pulse */
      @keyframes routePulse {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }
      @keyframes radarSweep {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }

      .animated-wire {
        stroke-dasharray: 8 12;
        animation: routePulse 3s linear infinite;
      }
      .float-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .float-card-2 {
        animation: floatReverse 7s ease-in-out infinite;
      }
      .pulsing-glow {
        animation: radarSweep 4s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Decorative Glow Circles -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulsing-glow" />
  <circle cx="1020" cy="260" r="180" fill="#818cf8" opacity="0.15" filter="url(#glow)" class="pulsing-glow" />

  <!-- Dynamic Ticket Routing Visual Diagram (Lower Area & Right Accent) -->
  <g transform="translate(680, 45)" filter="url(#cardGlow)">
    <!-- Connective Routing Flow Lines -->
    <path d="M 50 85 C 110 85, 110 50, 170 50" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8" class="animated-wire" />
    <path d="M 50 85 C 110 85, 110 130, 170 130" fill="none" stroke="#818cf8" stroke-width="2.5" opacity="0.8" class="animated-wire" />
    <path d="M 50 85 C 110 85, 110 205, 170 205" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.8" class="animated-wire" />
    <path d="M 310 50 C 350 50, 350 85, 385 85" fill="none" stroke="#34d399" stroke-width="2.5" opacity="0.8" class="animated-wire" />
    <path d="M 310 130 C 350 130, 350 95, 385 95" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8" class="animated-wire" />

    <!-- Inbound Channel Node (Left) -->
    <g class="float-card-1">
      <rect x="-30" y="55" width="105" height="60" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="22" y="78" text-anchor="middle" class="flow-node-text">📩 Inbound</text>
      <text x="22" y="98" text-anchor="middle" class="flow-subtext">Omnichannel</text>
    </g>

    <!-- Mid Tier Queues / Routing Engines -->
    <g class="float-card-2">
      <!-- Priority Queue Node -->
      <g transform="translate(170, 20)">
        <rect width="140" height="56" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" />
        <circle cx="20" cy="28" r="6" fill="#f43f5e" />
        <text x="36" y="27" class="flow-node-text">P0 / Urgent</text>
        <text x="36" y="44" class="flow-subtext">SLA &lt; 15 min</text>
      </g>

      <!-- Smart Triage Node -->
      <g transform="translate(170, 100)">
        <rect width="140" height="56" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
        <circle cx="20" cy="28" r="6" fill="#38bdf8" />
        <text x="36" y="27" class="flow-node-text">AI Skill Router</text>
        <text x="36" y="44" class="flow-subtext">Auto-Tag &amp; Assign</text>
      </g>

      <!-- Standard Queue Node -->
      <g transform="translate(170, 180)">
        <rect width="140" height="56" rx="8" fill="#111827" stroke="#64748b" stroke-width="1.2" />
        <circle cx="20" cy="28" r="6" fill="#10b981" />
        <text x="36" y="27" class="flow-node-text">General Desk</text>
        <text x="36" y="44" class="flow-subtext">Round-Robin Queue</text>
      </g>
    </g>

    <!-- Resolved / Agent Node (Right) -->
    <g transform="translate(385, 62)" class="float-card-1">
      <rect width="90" height="66" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
      <text x="45" y="86" text-anchor="middle" class="flow-node-text">🚀 Solved</text>
      <text x="45" y="106" text-anchor="middle" class="flow-subtext" fill="#a7f3d0">100% SLA</text>
    </g>
  </g>

  <!-- Foreground Main Headers (Guaranteed clear and unobstructed) -->
  <g transform="translate(70, 75)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="250" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#38bdf8" />
      <text x="30" y="19" class="badge-text" fill="#7dd3fc">HELP DESK &amp; TICKET ROUTING</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" class="title-text">Awesome Support Ticket</text>
    <text x="0" y="125" class="title-text">Tracking &amp; Routing 🎫⚡</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="170" class="subtitle-text">Curated list of SaaS helpdesks, shared inboxes, SLA-driven dispatchers</text>
    <text x="0" y="196" class="subtitle-text">&amp; production-ready open-source ticketing systems.</text>

    <!-- Feature Feature Badges -->
    <g transform="translate(0, 225)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="115" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="57" y="17" text-anchor="middle" class="badge-text" fill="#94a3b8">⚡ SLA Routing</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(125, 0)">
        <rect width="125" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="62" y="17" text-anchor="middle" class="badge-text" fill="#94a3b8">📬 Shared Inboxes</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(260, 0)">
        <rect width="115" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="57" y="17" text-anchor="middle" class="badge-text" fill="#94a3b8">🤖 AI Triage</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(385, 0)">
        <rect width="115" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="57" y="17" text-anchor="middle" class="badge-text" fill="#38bdf8">🔓 Open Source</text>
      </g>
    </g>
  </g>
</svg>
